<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 340" width="100%" height="100%" aria-label="A glowing Diwali diya">
  <defs>
    <!-- Radial aura glow -->
    <radialGradient id="auraGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#78350f" stop-opacity="0"/>
    </radialGradient>

    <!-- Clay Diya Terracotta Gradient -->
    <linearGradient id="clayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="45%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <!-- Clay Diya Inner Oil Bowl -->
    <linearGradient id="oilGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="60%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a02"/>
    </linearGradient>

    <!-- Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Flame Outer Glow Gradient -->
    <radialGradient id="flameOuter" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </radialGradient>

    <!-- Flame Middle Gradient -->
    <radialGradient id="flameMid" cx="50%" cy="75%" r="65%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="65%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </radialGradient>

    <!-- Flame Core White Gradient -->
    <radialGradient id="flameCore" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </radialGradient>
  </defs>

  <!-- Background Warm Glow Aura -->
  <circle cx="200" cy="140" r="140" fill="url(#auraGlow)">
    <animate attributeName="r" values="140;145;138;143;140" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.8;0.95;0.85" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Diya Base Drop Shadow -->
  <ellipse cx="200" cy="285" rx="140" ry="24" fill="#000000" opacity="0.45"/>

  <!-- Clay Diya Main Outer Body -->
  <path d="M 50 205 C 55 270 120 288 200 288 C 280 288 345 270 350 205 C 330 235 275 250 200 250 C 125 250 70 235 50 205 Z"
        fill="url(#clayGrad)" stroke="#431407" stroke-width="2"/>

  <!-- Traditional Decorative Floral Cuts on the Clay Base -->
  <g fill="#fef08a" opacity="0.75">
    <circle cx="140" cy="265" r="4"/>
    <circle cx="170" cy="272" r="4.5"/>
    <circle cx="200" cy="275" r="5"/>
    <circle cx="230" cy="272" r="4.5"/>
    <circle cx="260" cy="265" r="4"/>
  </g>

  <!-- Inner Oil Rim and Pool -->
  <ellipse cx="200" cy="205" rx="150" ry="32" fill="url(#oilGrad)" stroke="url(#goldRim)" stroke-width="5"/>
  <ellipse cx="200" cy="207" rx="135" ry="24" fill="#2d1205" opacity="0.9"/>

  <!-- Cotton Wick Tip -->
  <path d="M 194 212 C 196 195 204 195 206 212 Z" fill="#1c0a02"/>

  <!-- Animated Layered Flame -->
  <g id="animatedFlame" transform-origin="200 200">
    <!-- Subtle flame shape jitter/flicker via SMIL -->
    <animateTransform attributeName="transform" type="scale" values="1 1; 0.98 1.04; 1.02 0.97; 0.99 1.02; 1 1"
                      dur="1.8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 200 200; 1.5 200 200; -1.2 200 200; 0.8 200 200; 0 200 200"
                      dur="2.2s" repeatCount="indefinite"/>

    <!-- Outer Layer: Red-Orange -->
    <path d="M 200 65 C 165 125 155 175 170 198 C 182 215 218 215 230 198 C 245 175 235 125 200 65 Z"
          fill="url(#flameOuter)">
      <animate attributeName="opacity" values="0.9;1;0.88;0.95;0.9" dur="1.4s" repeatCount="indefinite"/>
    </path>

    <!-- Mid Layer: Golden Amber -->
    <path d="M 200 90 C 175 140 170 175 180 195 C 188 208 212 208 220 195 C 230 175 225 140 200 90 Z"
          fill="url(#flameMid)"/>

    <!-- Inner Core: Brilliant White-Yellow -->
    <path d="M 200 120 C 185 155 183 180 188 194 C 194 203 206 203 212 194 C 217 180 215 155 200 120 Z"
          fill="url(#flameCore)"/>
  </g>
</svg>
