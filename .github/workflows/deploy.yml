# Deploys through the Vercel CLI with the project owner's token, so commits from any GitHub
# collaborator deploy. Vercel's own Git deploys are disabled in vercel.json to avoid duplicates.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pull requests from forks get no secrets, so they cannot deploy.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Set deploy target
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "VERCEL_ENV=production" >> "$GITHUB_ENV"; echo "PROD_FLAG=--prod" >> "$GITHUB_ENV"
          else
            echo "VERCEL_ENV=preview" >> "$GITHUB_ENV"; echo "PROD_FLAG=" >> "$GITHUB_ENV"
          fi

      - name: Pull Vercel settings and env
        run: npx vercel@54.1.0 pull --yes --environment=$VERCEL_ENV --token="$VERCEL_TOKEN"

      - name: Build
        run: npx vercel@54.1.0 build $PROD_FLAG --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: echo "url=$(npx vercel@54.1.0 deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Preview deployed: $PREVIEW_URL"
